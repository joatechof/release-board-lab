name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test

  container:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Construir a imagem do commit
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          IMAGE="ghcr.io/${REPOSITORY,,}:sha-${COMMIT}"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build --build-arg APP_VERSION="$COMMIT" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --tag "$IMAGE" .
      - name: Testar o container antes de publicar
        env:
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          docker run -d --name release-board-ci --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges -p 127.0.0.1:3000:3000 "$IMAGE"
          node scripts/smoke.mjs
      - name: Publicar no GHCR apenas a partir de main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
          docker push "$IMAGE"
          DIGEST_IMAGE=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE")
          echo "Imagem publicada: $DIGEST_IMAGE" >> "$GITHUB_STEP_SUMMARY"
      - name: Logs para diagnóstico
        if: always()
        run: docker logs release-board-ci || true
